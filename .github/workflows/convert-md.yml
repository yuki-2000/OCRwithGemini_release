name: Convert Markdown to HTML and EPUB

on:
  push:
    paths:
      - '**.md'  # .mdファイルが変更されたときのみ実行

permissions:
  contents: write  # HTMLとEPUBをコミットするために書き込み権限が必要

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      # 1. コードのチェックアウト（履歴をすべて取得）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Pythonのセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Pandocのセットアップ (公式Action)
      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: '3.1.11'  # 'latest' の代わりに具体的なバージョンを指定

      # 4. 変更された.mdファイルの特定、クリーニング、HTML&EPUBへの変換
      - name: Clean and Convert Markdown to HTML and EPUB
        run: |
          # 今回のプッシュで追加・修正された .md ファイルを取得
          # (最初のコミットなどの場合は比較対象がないため、全ファイルを対象にする等の考慮が必要)
          files=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} | grep '\.md$' || true)
          
          if [ -z "$files" ]; then
            echo "No markdown files changed."
            exit 0
          fi

          for file in $files; do
            if [ "$file" = "clean_md.py" ]; then
              continue
            fi

            echo "Processing $file..."
            
            # --- [修正] 画像の相対パスを維持するため、同じフォルダ内に一時ファイル名を定義 ---
            temp_file="${file%.md}_temp.md"
            
            # 4-1. 元ファイルを上書きせず、補正済みのデータを一時ファイル（_temp.md）に書き出す
            python clean_md.py "$file" "$temp_file"

            # 4-2. 一時ファイルから HTML へ変換 (Pandoc 3.x のため --embed-resources を使用)
            output_html="${file%.md}.html"
            # pandoc "$file" --standalone --self-contained --katex -o "$output"
            # pandoc "$file" --standalone --self-contained --katex --template="$GITHUB_WORKSPACE/templates/easy_template.html" -o "$output"
            # pandoc "$file" --standalone --self-contained --katex --template="$GITHUB_WORKSPACE/templates/elegant_bootstrap_menu.html" --css "$GITHUB_WORKSPACE/templates/elegant_bootstrap.css" -o "$output"
            #pandoc "$file" --standalone --self-contained --katex --template="$GITHUB_WORKSPACE/templates/bootstrap_menu.html" --toc -o "$output"
            pandoc "$file" --standalone --embed-resources --template="$GITHUB_WORKSPACE/templates/bootstrap_menu2.html" --toc -o "$output_html"
            
            # 4-3. 一時ファイルから EPUB3 へ変換 (MathML適用) [2]
            output_epub="${file%.md}.epub"
            pandoc "$temp_file" -t epub3 --standalone --mathml --toc -o "$output_epub" [2]
            
            # 4-4. [追加] 変換が無事に終わったら、一時ファイルを即時削除
            rm -f "$temp_file"
            echo "Deleted temporary file: $temp_file"
            
          done

      # 5. 生成されたHTMLとEPUBをリポジトリにコミット
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-convert Markdown to HTML and EPUB [skip ci]"
          file_pattern: |
            **.html
            **.epub