name: Convert Markdown to HTML and EPUB

on:
  push:
    paths:
      - '**.md'  # .mdファイルが変更されたときのみ実行

permissions:
  contents: write  # HTMLとEPUBをコミットするために書き込み権限が必要

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 1. コードのチェックアウト（履歴をすべて取得）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Pythonのセットアップ (clean_md.py の実行に必要)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Pandocのセットアップ (公式Action)
      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: '3.1.11'  # 安定稼働する特定のバージョンを指定

      # 4. 変更された.mdファイルを特定、サブフォルダに移動してクリーニングおよび変換
      - name: Clean and Convert Markdown to HTML and EPUB
        run: |
          # 今回のプッシュで追加・修正された .md ファイルを取得
          files=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} | grep '\.md$' || true)
          
          if [ -z "$files" ]; then
            echo "No markdown files changed."
            exit 0
          fi

          for file in $files; do
            if [ "$file" = "clean_md.py" ]; then
              continue
            fi

            echo "Processing $file..."
            
            # ディレクトリパスとファイル名を分離
            dir_path=$(dirname "$file")
            file_name=$(basename "$file")
            
            # ディレクトリ内での一時ファイル名と出力ファイル名を定義
            temp_file_name="${file_name%.md}_temp.md"
            output_html="${file_name%.md}.html"
            output_epub="${file_name%.md}.epub"

            # サブシェル ( ) を使い、該当ファイルのディレクトリに移動して実行
            # これにより画像フォルダ(images/等)の相対パスが、ファイル基準で正しく解決されます
            (
              cd "$dir_path" || exit
              
              # 4-1. clean_md.py を実行 (ワークスペースのルートからスクリプトを参照)
              python "$GITHUB_WORKSPACE/clean_md.py" "$file_name" "$temp_file_name"

              # 4-2. HTMLへ変換 (--embed-resources で画像をHTML内に埋め込む) [2.1.8]
              # pandoc "$file" --standalone --self-contained --katex -o "$output"
              # pandoc "$file" --standalone --self-contained --katex --template="$GITHUB_WORKSPACE/templates/easy_template.html" -o "$output"
              # pandoc "$file" --standalone --self-contained --katex --template="$GITHUB_WORKSPACE/templates/elegant_bootstrap_menu.html" --css "$GITHUB_WORKSPACE/templates/elegant_bootstrap.css" -o "$output"
              # pandoc "$file" --standalone --self-contained --katex --template="$GITHUB_WORKSPACE/templates/bootstrap_menu.html" --toc -o "$output"
              # pandoc "$file_name" --standalone --embed-resources --template="$GITHUB_WORKSPACE/templates/bootstrap_menu2.html" --toc -o "$output_html"
              
              # HTMLへ変換（--mathjaxで数式をMathJaxに渡す。画像は埋め込まない）
              pandoc "$file_name" --standalone --mathjax --metadata title="${file_name%.md}" --template="$GITHUB_WORKSPACE/templates/bootstrap_menu2.html" --toc -o "$output_html"
              # 変換後、画像をbase64でHTMLに埋め込む（カレントディレクトリ=画像フォルダ）
              python "$GITHUB_WORKSPACE/embed_images.py" "$output_html" "."
              


              # 4-3. クリーニング済み一時ファイルから EPUB3 へ変換 (MathML適用) [2]
              pandoc "$temp_file_name" -t epub3 --standalone --mathml --metadata title="${file_name%.md}" --toc -o "$output_epub"
              
              # 4-4. 一時ファイルを削除
              rm -f "$temp_file_name"
              echo "Finished processing in $dir_path"
            )
            
          done

      
      # 5. 生成されたHTMLとEPUBをリポジトリにコミット
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-convert Markdown to HTML and EPUB [skip ci]"
          # 1. 改行を防ぐため、スペース区切りの1行で指定します
          file_pattern: '**.html **.epub'
          # 2. シェルではなく、Gitに直接パターンを解釈させて全階層を再帰的（**）に探索させます
          disable_globbing: true
          # 3. 新規ファイルを無視してしまう --update を、新規も変更も含める --all に変更します
          add_options: '--all'
      
